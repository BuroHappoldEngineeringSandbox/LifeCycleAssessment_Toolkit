name: zz-report-probe

# Three ways of showing every test's result, over one run of the hardened
# action. All three are job-summary only: no extra check run, no PR comment.

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  reporters:
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    steps:
      - name: Run hardened ci-unit-tests
        id: tests
        continue-on-error: true
        uses: BuroHappoldEngineeringSandbox/CI_Toolkit/.github/actions/ci-unit-tests@probe/ut-hardening
        with:
          app_id: ${{ secrets.BHOM_APP_ID }}
          private_key: ${{ secrets.BHOM_APP_PRIVATE_KEY }}

      - name: Inventory of what the action left behind
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem TestResults -Filter *.trx -Recurse -EA SilentlyContinue |
            ForEach-Object { Write-Host "TRXFILE|$($_.Name)|$([math]::Round($_.Length/1KB,1))KB" }

      # (a) Ours, built from the TRX files the action already reads.
      - name: 'Option A: own job summary'
        if: always()
        shell: pwsh
        run: |
          $before = (Get-Item $env:GITHUB_STEP_SUMMARY).Length
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $out = New-Object Text.StringBuilder
          [void]$out.AppendLine("## Option A: unit tests, built from TRX")
          [void]$out.AppendLine("")
          $files = @(Get-ChildItem TestResults -Filter *.trx -EA SilentlyContinue | Sort-Object Name)
          $grand = @{ passed = 0; failed = 0; notrun = 0 }
          foreach ($f in $files) {
            [xml]$x = Get-Content $f.FullName
            $c = $x.TestRun.ResultSummary.Counters
            $results = @($x.TestRun.Results.UnitTestResult)
            $p = @($results | Where-Object { $_.outcome -eq 'Passed' })
            $fl = @($results | Where-Object { $_.outcome -eq 'Failed' })
            $nr = @($results | Where-Object { $_.outcome -ne 'Passed' -and $_.outcome -ne 'Failed' })
            $grand.passed += $p.Count; $grand.failed += $fl.Count; $grand.notrun += $nr.Count
            $icon = if ($fl.Count) { ':x:' } else { ':white_check_mark:' }
            [void]$out.AppendLine("### $icon $([IO.Path]::GetFileNameWithoutExtension($f.Name))")
            [void]$out.AppendLine("")
            [void]$out.AppendLine("$($p.Count) passed, $($fl.Count) failed, $($nr.Count) not run, of $($c.total) in the run.")
            [void]$out.AppendLine("")
            if ($fl.Count) {
              [void]$out.AppendLine("| Failed test | Message |")
              [void]$out.AppendLine("|---|---|")
              foreach ($t in $fl) {
                $msg = ($t.Output.ErrorInfo.Message -replace '\r?\n', ' ' -replace '\|', '\|')
                if ($msg.Length -gt 200) { $msg = $msg.Substring(0, 200) + ' ...' }
                [void]$out.AppendLine("| ``$($t.testName)`` | $msg |")
              }
              [void]$out.AppendLine("")
            }
            [void]$out.AppendLine("<details><summary>All $($results.Count) results</summary>")
            [void]$out.AppendLine("")
            [void]$out.AppendLine("| Test | Outcome |")
            [void]$out.AppendLine("|---|---|")
            foreach ($t in $results) {
              $o = switch ($t.outcome) { 'Passed' { 'passed' } 'Failed' { 'failed' } default { 'not run' } }
              [void]$out.AppendLine("| ``$($t.testName)`` | $o |")
            }
            [void]$out.AppendLine("")
            [void]$out.AppendLine("</details>")
            [void]$out.AppendLine("")
          }
          [void]$out.AppendLine("**Total: $($grand.passed) passed, $($grand.failed) failed, $($grand.notrun) not run.**")
          $text = $out.ToString()
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $text
          $sw.Stop()
          $after = (Get-Item $env:GITHUB_STEP_SUMMARY).Length
          Write-Host "SIZE|OptionA|bytes=$([Text.Encoding]::UTF8.GetByteCount($text))|summaryTotal=$after|ms=$($sw.ElapsedMilliseconds)"
          Write-Host "COUNTS|OptionA|passed=$($grand.passed)|failed=$($grand.failed)|notrun=$($grand.notrun)|files=$($files.Count)"

      # (b) dorny/test-reporter v3.0.0, pinned to its commit.
      - name: 'Option B: dorny/test-reporter'
        if: always()
        continue-on-error: true
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: 'Option B'
          path: 'TestResults/*.trx'
          reporter: dotnet-trx
          use-actions-summary: 'true'
          only-summary: 'false'
          list-suites: 'all'
          list-tests: 'all'
          fail-on-error: 'false'
          fail-on-empty: 'false'

      - name: Size after Option B
        if: always()
        shell: pwsh
        run: Write-Host "SIZE|afterB|summaryTotal=$((Get-Item $env:GITHUB_STEP_SUMMARY).Length)"

      # (c) EnricoMi publish-unit-test-result-action, composite variant.
      - name: 'Option C: EnricoMi composite'
        if: always()
        continue-on-error: true
        uses: EnricoMi/publish-unit-test-result-action/composite@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2.25.0
        with:
          trx_files: 'TestResults/*.trx'
          check_run: 'false'
          comment_mode: 'off'
          job_summary: 'true'
          action_fail: 'false'
          action_fail_on_inconclusive: 'false'
          report_individual_runs: 'true'

      - name: Final summary size
        if: always()
        shell: pwsh
        run: |
          $len = (Get-Item $env:GITHUB_STEP_SUMMARY).Length
          Write-Host "SIZE|final|summaryTotal=$len|capKiB=1024|overCap=$([bool]($len -gt 1048576))"

      - name: Upload TRX and summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: report-probe-${{ github.run_id }}-${{ github.job }}
          path: |
            TestResults/
          retention-days: 7
