name: zz-rep2

# ci-unit-tests with the run moved into a script (probe/ut-ps) beside develop
# (probe/ut-develop-ref), so summaries, annotations and verdicts can be compared.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  script:
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    steps:
      - name: ci-unit-tests, run in a script
        continue-on-error: true
        uses: BuroHappoldEngineeringSandbox/CI_Toolkit/.github/actions/ci-unit-tests@probe/ut-ps
        with:
          app_id: ${{ secrets.BHOM_APP_ID }}
          private_key: ${{ secrets.BHOM_APP_PRIVATE_KEY }}
      - name: Dump step summaries
        if: always()
        shell: pwsh
        run: Get-ChildItem (Split-Path $env:GITHUB_STEP_SUMMARY) -Filter 'step_summary_*' | Sort-Object LastWriteTime | ForEach-Object { Write-Host "SUMMARYFILE|$($_.Name)|$($_.Length)"; Get-Content $_.FullName | ForEach-Object { Write-Host "SUMMARYLINE|$_" } }

  develop:
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    steps:
      - name: ci-unit-tests, develop
        continue-on-error: true
        uses: BuroHappoldEngineeringSandbox/CI_Toolkit/.github/actions/ci-unit-tests@probe/ut-develop-ref
        with:
          app_id: ${{ secrets.BHOM_APP_ID }}
          private_key: ${{ secrets.BHOM_APP_PRIVATE_KEY }}
      - name: Dump step summaries
        if: always()
        shell: pwsh
        run: Get-ChildItem (Split-Path $env:GITHUB_STEP_SUMMARY) -Filter 'step_summary_*' | Sort-Object LastWriteTime | ForEach-Object { Write-Host "SUMMARYFILE|$($_.Name)|$($_.Length)"; Get-Content $_.FullName | ForEach-Object { Write-Host "SUMMARYLINE|$_" } }
