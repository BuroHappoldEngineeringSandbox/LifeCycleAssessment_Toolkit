name: zz-rep2

# The reporting/coverage branch, run with contents: read only, to show that
# nothing in the job needs write access now the PR comment is gone.

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  run:
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    steps:
      - name: ci-unit-tests with the summary and changed-lines coverage
        continue-on-error: true
        uses: BuroHappoldEngineeringSandbox/CI_Toolkit/.github/actions/ci-unit-tests@probe/ut-report-rebased
        with:
          app_id: ${{ secrets.BHOM_APP_ID }}
          private_key: ${{ secrets.BHOM_APP_PRIVATE_KEY }}
