name: zz-cov-probe

# One job per coverage mode over the same tree, so the denominator can be
# compared directly. Each job prints per-assembly line totals from every
# Cobertura file produced, which is the figure the percentage is built on.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    strategy:
      fail-fast: false
      matrix:
        mode: [coverlet, coverlet-filtered, mscollector]
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    steps:
      - name: Run with coverage_mode=${{ matrix.mode }}
        continue-on-error: true
        uses: BuroHappoldEngineeringSandbox/CI_Toolkit/.github/actions/ci-unit-tests@probe/ut-cov
        with:
          app_id: ${{ secrets.BHOM_APP_ID }}
          private_key: ${{ secrets.BHOM_APP_PRIVATE_KEY }}
          coverage_mode: ${{ matrix.mode }}

      - name: Per-assembly line totals
        if: always()
        shell: pwsh
        run: |
          $files = @(Get-ChildItem TestResults -Recurse -Include *cobertura.xml -EA SilentlyContinue)
          Write-Host "COVFILES|${{ matrix.mode }}|count=$($files.Count)"
          $byAsm = @{}
          $seen  = @{}
          foreach ($f in $files) {
            [xml]$x = Get-Content $f.FullName
            foreach ($pkg in $x.coverage.packages.package) {
              $name = $pkg.name
              if (-not $byAsm.ContainsKey($name)) { $byAsm[$name] = @{ covered = 0; total = 0 } }
              foreach ($c in $pkg.classes.class) {
                foreach ($l in $c.lines.line) {
                  $key = "$name|$($c.filename)|$($l.number)"
                  if ($seen.ContainsKey($key)) {
                    if ([int]$l.hits -gt 0 -and $seen[$key] -eq 0) { $byAsm[$name].covered++; $seen[$key] = 1 }
                    continue
                  }
                  $seen[$key] = [int]$l.hits -gt 0 ? 1 : 0
                  $byAsm[$name].total++
                  if ([int]$l.hits -gt 0) { $byAsm[$name].covered++ }
                }
              }
            }
          }
          $gc = 0; $gt = 0
          foreach ($k in ($byAsm.Keys | Sort-Object)) {
            $gc += $byAsm[$k].covered; $gt += $byAsm[$k].total
            $pct = if ($byAsm[$k].total) { [math]::Round(100.0 * $byAsm[$k].covered / $byAsm[$k].total, 1) } else { 0 }
            Write-Host "COVASM|${{ matrix.mode }}|$k|$($byAsm[$k].covered)|$($byAsm[$k].total)|$pct"
          }
          $gp = if ($gt) { [math]::Round(100.0 * $gc / $gt, 1) } else { 0 }
          Write-Host "COVTOTAL|${{ matrix.mode }}|covered=$gc|coverable=$gt|pct=$gp|assemblies=$($byAsm.Count)"

      - name: Upload coverage files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cov-${{ matrix.mode }}-${{ github.run_id }}
          path: TestResults/
          retention-days: 7
